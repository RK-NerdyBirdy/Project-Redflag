version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: redflag
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      RF_DB_URL: jdbc:postgresql://postgres:5432/redflag
      RF_DB_USER: admin
      RF_DB_PASS: password
      RF_PORT: COM8
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
